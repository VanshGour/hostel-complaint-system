services:
  postgres:
    image: postgres:16-alpine
    container_name: hostel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hostel_complaints
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/src/main/resources/db/migration/V2__seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hostel_complaints"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hostel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hostel_complaints
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      SPRING_PROFILES_ACTIVE: postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
