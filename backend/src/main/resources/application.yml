server:
  port: 8080

spring:
  application:
    name: hostel-complaint-system
  datasource:
    url: jdbc:h2:mem:hosteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Application Specific Configurations
app:
  jwt:
    # 256-bit base64-encoded secret key for HMAC-SHA256
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 Hours
  college:
    allowed-domain: campus.edu # Restrict registration to college domain
  escalation:
    stale-hours: 48 # Stale ticket threshold for auto-escalation
    cron: "0 0 */2 * * *" # Run SLA evaluation every 2 hours
  mail:
    enabled: false # Set true and provide SMTP settings for real outbound emails

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
